name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check:format
      - run: git diff --check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:release-tools
      - run: npm run check:licenses
      - run: npm run build
      - run: npm run validate:worker -- --dry-run
      - run: npm run pack:smoke
      - run: npm run test:e2e
