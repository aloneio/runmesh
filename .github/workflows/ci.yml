name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI executes code from pull requests; do not leave a readable
          # GITHUB_TOKEN credential in the checkout for build scripts.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:versions
      - run: npm run check:format
      - run: git diff --check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:release-tools
      - run: npm run check:licenses
      - run: npm run build
      - run: npm run validate:worker -- --dry-run
      - run: npm run validate:worker -- --dry-run --env production
      - run: npm run pack:smoke
      - run: npm run test:e2e
