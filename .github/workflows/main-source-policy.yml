# Generated by scripts/check-main-policy.mjs --write; review source and output together.
name: Main promotion policy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Metadata only: no checkout, npm install, secrets, write token or deployment.
permissions: {}

concurrency:
  group: main-source-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require same-repository dev source
        shell: bash
        run: |
          node <<'RUNMESH_POLICY'
          const fs = require("node:fs");
          function githubMainPromotion(event, environment) {
            const reject = () => { throw new Error("main accepts only an open pull request from this repository's dev branch"); };
            const pr = event?.pull_request;
            const id = environment.GITHUB_REPOSITORY_ID;
            if (environment.GITHUB_EVENT_NAME !== "pull_request"
              || !/^[1-9][0-9]*$/u.test(id ?? "")
              || !["opened", "reopened", "synchronize", "edited", "ready_for_review"].includes(event?.action)
              || pr?.state !== "open" || !Number.isSafeInteger(pr.number) || pr.number < 1
              || environment.GITHUB_REF !== `refs/pull/${pr.number}/merge`
              || String(event.repository?.id) !== id
              || String(pr.base?.repo?.id) !== id || String(pr.head?.repo?.id) !== id
              || pr.base?.repo?.full_name !== environment.GITHUB_REPOSITORY
              || pr.head?.repo?.full_name !== environment.GITHUB_REPOSITORY
              || pr.base?.ref !== "main" || pr.head?.ref !== "dev"
              || typeof pr.head?.sha !== "string" || !/^[a-f0-9]{40}$/u.test(pr.head.sha)) reject();
            return { policy: "main-from-dev-v1", allowed: true, pull_request: pr.number };
          }
          try {
            const path = process.env.GITHUB_EVENT_PATH;
            const info = fs.statSync(path);
            if (!info.isFile() || info.size > 2097152) throw new Error("invalid event input");
            console.log(JSON.stringify(githubMainPromotion(JSON.parse(fs.readFileSync(path, "utf8")), process.env)));
          } catch {
            console.error("main_source_policy_denied: use a same-repository dev -> main pull request");
            process.exitCode = 1;
          }
          RUNMESH_POLICY
