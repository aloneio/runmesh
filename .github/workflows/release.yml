name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --workspace=@aloneio/runmesh-protocol --pack-destination release
      - run: npm pack --workspace=@aloneio/runmesh-runner --pack-destination release
      - name: Generate checksums and manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          sha256sum release/*.tgz > release/SHA256SUMS
          VERSION="${RELEASE_TAG#v}"
          node -e 'const fs=require("fs"),version=process.env.VERSION; const files=fs.readdirSync("release").filter(f=>f.endsWith(".tgz")); const artifacts=files.map(f=>({name:f,sha256:require("crypto").createHash("sha256").update(fs.readFileSync("release/"+f)).digest("hex"),size:fs.statSync("release/"+f).size})); fs.writeFileSync("release/manifest.json",JSON.stringify({schema_version:1,version,channel:"stable",published_at:new Date().toISOString(),artifacts},null,2)+"\n")'        env:
          VERSION: ${{ github.ref_name }}
      - name: Sign manifest when signing key is configured
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/runmesh-release-key
            openssl dgst -sha256 -sign /tmp/runmesh-release-key -out release/manifest.sig release/manifest.json
            rm -f /tmp/runmesh-release-key
          else
            echo 'RELEASE_SIGNING_KEY is not configured; refusing to claim a signed release.'
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
