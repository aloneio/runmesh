name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Development preview version; must be 0.1.0-dev.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: signed development preview from dev
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release identity and secrets
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "0.1.0-dev.1"
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$RELEASE_SIGNING_KEY_ID"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          test "$(node -p 'require("./apps/runner/package.json").version')" = "$RELEASE_VERSION"
          test "$(node -p 'require("./apps/worker/package.json").version')" = "$RELEASE_VERSION"
          test "$(node -p 'require("./packages/protocol/package.json").version')" = "$RELEASE_VERSION"
          node scripts/release-signature.mjs validate-key release/trust-keyring.json "$RELEASE_SIGNING_KEY_ID"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run test:release-tools
      - run: npm run build
      - run: npm run validate:worker -- --dry-run
      - run: npm run check:licenses
      - run: npm run pack:smoke
      - name: Build immutable platform artifacts
        run: |
          set -euo pipefail
          rm -rf release/assets
          mkdir -p release/assets
          npm pack --workspace=@aloneio/runmesh-runner --pack-destination release/assets
          packed="$(find release/assets -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$packed"
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            cp "$packed" "release/assets/runmesh-runner-${RELEASE_VERSION}-${platform}.tgz"
          done
          rm "$packed"
      - name: Generate deterministic manifest and checksums
        run: |
          set -euo pipefail
          published_at="$(date --utc --date="@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/release-manifest.mjs release/assets "$(git rev-parse HEAD)" "$published_at"
          (cd release/assets && sha256sum *.tgz manifest.json > SHA256SUMS)
      - name: Sign and verify manifest
        run: |
          set -euo pipefail
          node scripts/release-signature.mjs sign release/assets/manifest.json release/assets/manifest.sig release/assets/manifest.signature.json release/trust-keyring.json "$RELEASE_SIGNING_KEY_ID"
          node scripts/release-signature.mjs verify release/assets/manifest.json release/assets/manifest.sig release/assets/manifest.signature.json release/trust-keyring.json "$RELEASE_SIGNING_KEY_ID"
          cp release/trust-keyring.json LICENSE NOTICE THIRD_PARTY_NOTICES.md release/assets/
      - name: Verify tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1
          ! gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1
      - name: Create annotated tag and development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aloneio"
          git config user.email "git@aloneio.aleeas.com"
          git tag -a "v${RELEASE_VERSION}" -m "Runmesh v${RELEASE_VERSION} development preview"
          git push origin "v${RELEASE_VERSION}"
          gh release create "v${RELEASE_VERSION}" release/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Runmesh v${RELEASE_VERSION}" \
            --prerelease \
            --notes-file docs/release-notes-v0.1.0-dev.1.md
      - name: Re-download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release/download
          gh release download "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --dir release/download
          (cd release/download && sha256sum -c SHA256SUMS)
          node scripts/release-signature.mjs verify release/download/manifest.json release/download/manifest.sig release/download/manifest.signature.json release/download/trust-keyring.json "$RELEASE_SIGNING_KEY_ID"
          tar -xOf "$(find release/download -name 'runmesh-runner-*-linux-x64.tgz' -print -quit)" package/package.json | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{if(JSON.parse(x).version!=="0.1.0-dev.1")process.exit(1)})'
