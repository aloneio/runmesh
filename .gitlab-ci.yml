stages:
  - verify
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

image: node:22-bookworm

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  script:
    - npm ci
    - npm run check:versions
    - npm run check:format
    - git diff --check
    - npm run typecheck
    - npm run test:unit
    - npm run test:release-tools
    - npm run check:licenses
    - npm run build
    - npm run validate:worker -- --dry-run
    - npm run pack:smoke
    - npm run test:e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

cloudflare_deploy:
  stage: deploy
  needs:
    - job: verify
  image: node:22-bookworm
  script:
    - npm ci
    - npm run check:versions
    - npm run typecheck
    - npm exec --offline -- wrangler deploy --config apps/worker/wrangler.jsonc --strict
  environment:
    name: production
  resource_group: cloudflare-production
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
    - when: never
