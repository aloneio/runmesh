stages:
  - verify
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never
image: node:22.23.2-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
variables:
  npm_config_cache: $CI_PROJECT_DIR/.npm
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
verify:
  stage: verify
  script:
    - npm install --global npm@10.9.3
    - node scripts/ci-check.mjs toolchain
    - node scripts/ci-check.mjs install
    - node scripts/ci-check.mjs dependencies
    - node scripts/ci-check.mjs production_dependencies
    - node scripts/ci-check.mjs docs
    - node scripts/ci-check.mjs ci_policy
    - node scripts/ci-check.mjs runbooks
    - node scripts/ci-check.mjs versions
    - node scripts/ci-check.mjs format
    - node scripts/ci-check.mjs architecture
    - node scripts/ci-check.mjs inventory
    - node scripts/ci-check.mjs promotion
    - node scripts/ci-check.mjs whitespace
    - node scripts/ci-check.mjs types
    - node scripts/ci-check.mjs unit
    - node scripts/ci-check.mjs security
    - node scripts/ci-check.mjs tooling
    - node scripts/ci-check.mjs licenses
    - node scripts/ci-check.mjs build
    - node scripts/ci-check.mjs worker_default
    - node scripts/ci-check.mjs worker_dev
    - node scripts/ci-check.mjs worker_prod
    - node scripts/ci-check.mjs release_contract
    - node scripts/ci-check.mjs package_smoke
    - node scripts/ci-check.mjs transport
    - node scripts/ci-check.mjs installed_transport
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never
  timeout: 30m
  interruptible: true
  allow_failure: false
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-results/*.json
      - ci-results/*.xml
    reports:
      junit: ci-results/*.xml
browser:
  stage: verify
  timeout: 15m
  interruptible: true
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never
  script:
    - npm install --global npm@10.9.3
    - npm ci
    - npm run typecheck
    - npm run build
    - npm run browser:install
    - npm run test:browser
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-results/*.json
      - ci-results/*.xml
    reports:
      junit: ci-results/*.xml

# BEGIN GENERATED MAIN SOURCE POLICY
main-source-policy:
  stage: .pre
  image: node:22.23.2-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
  inherit:
    default: false
    variables: false
  variables:
    GIT_STRATEGY: none
  cache: []
  dependencies: []
  needs: []
  before_script: []
  after_script: []
  services: []
  tags: []
  allow_failure: false
  interruptible: false
  timeout: 2m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  script:
    - |
      node <<'RUNMESH_POLICY'
      function gitlabMainPromotion(environment) {
        const reject = () => { throw new Error("main accepts only a same-project dev merge request with current MR metadata"); };
        if (environment.CI_PIPELINE_SOURCE !== "merge_request_event"
          || !/^[1-9][0-9]*$/u.test(environment.CI_MERGE_REQUEST_IID ?? "")
          || typeof environment.CI_MERGE_REQUEST_TARGET_BRANCH_NAME !== "string"
          || environment.CI_MERGE_REQUEST_TARGET_BRANCH_NAME.length === 0) reject();
        if (environment.CI_MERGE_REQUEST_TARGET_BRANCH_NAME !== "main") {
          return { policy: "main-from-dev-v1", applies: false };
        }
        // The MR project is its target project. GitLab does not define a
        // CI_MERGE_REQUEST_TARGET_PROJECT_ID environment variable.
        const id = environment.CI_PROJECT_ID;
        if (!/^[1-9][0-9]*$/u.test(id ?? "")
          || environment.CI_MERGE_REQUEST_SOURCE_PROJECT_ID !== id
          || environment.CI_MERGE_REQUEST_PROJECT_ID !== id
          || environment.CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !== "dev") reject();
        return { policy: "main-from-dev-v1", allowed: true };
      }
      try { console.log(JSON.stringify(gitlabMainPromotion(process.env))); }
      catch {
        console.error("main_source_policy_denied: use a same-project dev -> main merge request");
        process.exitCode = 1;
      }
      RUNMESH_POLICY
